name: Test & Verify Greg Action

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Test prompt to execute in automation mode"
        required: false
        default: "Inspect package.json and summarize the project details."
      model:
        description: "Model to use for live test"
        required: false
        default: "google/gemini-flash-lite-latest"

jobs:
  quality-gate:
    name: Typecheck, Format & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        run: |
          if ! command -v bun >/dev/null 2>&1; then
            npm install -g bun
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code Formatting
        run: npm run format:check

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Run Test Suite
        run: bun test

  live-action-test:
    name: Live Action Execution
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Test the action directly in this repository using `uses: ./`
      - name: Run Greg Action (Automation Mode Self-Test)
        id: test-greg
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.AI_API_KEY }}
          model: ${{ inputs.model || 'google/gemini-flash-lite-latest' }}
          mode: "automation"
          prompt: ${{ inputs.prompt || 'Inspect package.json and verify the action configuration.' }}
          allowed_tools: "ReadFile, Glob, Grep"

      - name: Assert Action Results
        env:
          CONCLUSION: ${{ steps.test-greg.outputs.conclusion }}
          STRUCTURED_OUTPUT: ${{ steps.test-greg.outputs.structured_output }}
        run: |
          echo "Conclusion: $CONCLUSION"
          echo "Structured Output length: ${#STRUCTURED_OUTPUT}"
          if [ "$CONCLUSION" != "success" ]; then
            echo "Action did not succeed: $CONCLUSION"
            exit 1
          fi
