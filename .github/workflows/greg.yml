name: Greg Assistant

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  greg:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@greg')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@greg')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@greg')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@greg') || contains(github.event.issue.title, '@greg') || github.event.assignee.login == 'greg'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Greg Action
        uses: ./
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.AI_API_KEY }}
          model: "google/gemini-flash-lite-latest"
          allowed_tools: "ReadFile, EditFile, WriteFile, Glob, Grep, Bash(npm:*), Bash(git:*)"
